<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atelier Imóveis | Espaços que transformam perspectivas</title>
    <meta name="description" content="Curadoria de imóveis selecionados por arquitetura, luz, materiais e localização. Protótipo demonstrativo." />
    <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier Imóveis" />
    <meta property="og:title" content="Atelier Imóveis | Espaços que transformam perspectivas" />
    <meta property="og:description" content="Curadoria de imóveis selecionados por arquitetura, luz, materiais e localização." />
    <meta property="og:image" content="%BASE_URL%og-image.svg" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('atelier:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <noscript>Este protótipo precisa de JavaScript habilitado.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
